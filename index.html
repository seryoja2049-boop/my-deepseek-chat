<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek Professional Workspace</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1b26;
            --chat-bg: #24283b;
            --text-color: #a9b1d6;
            --primary-color: #7aa2f7;
            --user-msg-bg: #3b4261;
            --ai-msg-bg: #2f334d;
            --border-color: #414868;
            --accent-color: #bb9af7;
            --agent-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 330px;
            background-color: var(--chat-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar h2 { font-size: 1.1rem; color: var(--primary-color); }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 0.8rem; color: #565f89; font-weight: bold; }
        input, textarea, select {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: #c0caf5;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }
        
        button {
            color: #1a1b26;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .btn-blue { background-color: var(--primary-color); width: 100%; }
        .btn-green { background-color: var(--agent-color); color: white; width: 100%; font-size: 0.95rem; }
        .clear-btn { background-color: #f7768e; color: #1a1b26; }

        .file-box {
            border: 2px dashed var(--border-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            cursor: pointer;
        }
        .file-box:hover { border-color: var(--accent-color); }
        #fileInput { display: none; }
        
        .progress-container {
            width: 100%;
            background-color: #16161e;
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
            display: none;
            margin-top: 10px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }
        .progress-bar.loading {
            width: 100% !important;
            animation: pulse 1.5s infinite ease-in-out;
            background-color: var(--agent-color);
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .attached-files-list {
            font-size: 0.85rem;
            max-height: 100px;
            overflow-y: auto;
            color: var(--accent-color);
            margin-top: 5px;
        }

        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; }
        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }
        
        .message-wrapper { display: flex; flex-direction: column; position: relative; max-width: 85%; }
        .user-wrapper { align-self: flex-end; }
        .ai-wrapper { align-self: flex-start; }

        .message { padding: 15px 20px; border-radius: 12px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; width: 100%; }
        .user-message { background-color: var(--user-msg-bg); border-bottom-right-radius: 2px; }
        .ai-message { background-color: var(--ai-msg-bg); border-bottom-left-radius: 2px; border: 1px solid rgba(255,255,255,0.05); padding-top: 25px; }
        
        .copy-btn {
            position: absolute; top: 6px; right: 10px; background: rgba(255, 255, 255, 0.08); color: #a9b1d6;
            border: none; padding: 3px 8px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; font-weight: normal; display: none;
        }
        .copy-btn:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }

        .agent-log {
            font-family: 'Courier New', Courier, monospace; background: #16161e; color: #10b981;
            padding: 10px; border-left: 3px solid #10b981; margin-bottom: 10px; font-size: 0.85rem; border-radius: 4px; max-width: 85%;
        }

        .chat-input-area { padding: 20px; background-color: var(--chat-bg); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; gap: 12px; align-items: center; }
        .chat-input-area textarea { flex: 1; resize: none; height: 60px; font-family: inherit; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <h2>OpenRouter Настройки</h2>
            <div class="form-group" style="margin-top: 15px;">
                <label for="apiKey">OpenRouter API Ключ:</label>
                <input type="password" id="apiKey" placeholder="sk-or-v1-...">
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label for="modelSelect">Модель ИИ:</label>
                <select id="modelSelect">
                    <option value="deepseek/deepseek-chat">DeepSeek V3 (Флагман — Блиц)</option>
                    <option value="deepseek/deepseek-r1">DeepSeek R1 (Рассуждения — Умный)</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label for="systemPrompt">Системные инструкции:</label>
                <textarea id="systemPrompt" rows="4">Ты — продвинутый ИИ-юрист и аналитик. Тщательно изучай предоставленные выдержки из документов, кодексов и таблиц. Давай структурированные ответы со ссылками на конкретные пункты, статьи и законы.</textarea>
            </div>
        </div>

        <div>
            <h2>Загрузка документов</h2>
            <div class="file-box" onclick="document.getElementById('fileInput').click()">
                <p>+ Загрузить файл</p>
                <p style="font-size: 0.7rem; color: #565f89;">DOCX, XLSX, TXT, CSV, JSON</p>
                <input type="file" id="fileInput" multiple accept=".docx,.xlsx,.xls,.txt,.md,.csv,.json">
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="attached-files-list" id="filesList"></div>
        </div>

        <button class="btn-blue" id="saveSettingsBtn">Сохранить конфиг</button>
        <button class="clear-btn" id="clearChatBtn" style="margin-top: auto;">Очистить всё</button>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <div class="input-row">
                <textarea id="userInput" placeholder="Задайте вопрос по документам... (Ctrl + Enter для отправки)"></textarea>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <button class="btn-green" id="dualSendBtn">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKeyInput = document.getElementById('apiKey');
        const modelSelect = document.getElementById('modelSelect');
        const systemPromptInput = document.getElementById('systemPrompt');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const dualSendBtn = document.getElementById('dualSendBtn');
        const fileInput = document.getElementById('fileInput');
        const filesList = document.getElementById('filesList');
        
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        let chatHistory = [];
        let uploadedFilesContent = [];

        // Восстановление сохраненного ключа и настроек из памяти браузера при старте
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('dual_key')) apiKeyInput.value = localStorage.getItem('dual_key');
            if (localStorage.getItem('dual_system')) systemPromptInput.value = localStorage.getItem('dual_system');
            if (localStorage.getItem('dual_model')) modelSelect.value = localStorage.getItem('dual_model');
        });

        saveSettingsBtn.addEventListener('click', () => {
            localStorage.setItem('dual_key', apiKeyInput.value.trim());
            localStorage.setItem('dual_system', systemPromptInput.value.trim());
            localStorage.setItem('dual_model', modelSelect.value);
            alert('Конфигурация успешно сохранена в браузере!');
        });

        clearChatBtn.addEventListener('click', () => {
            chatHistory = []; 
            uploadedFilesContent = []; 
            filesList.innerHTML = ''; 
            chatMessages.innerHTML = '';
            hideProgress();
        });

        function showProgress(pct) {
            progressContainer.style.display = 'block';
            progressBar.classList.remove('loading');
            progressBar.style.width = pct + '%';
        }
        function showAiThinkingProgress() {
            progressContainer.style.display = 'block';
            progressBar.classList.add('loading');
        }
        function hideProgress() {
            progressContainer.style.display = 'none';
            progressBar.style.width = '0%';
            progressBar.classList.remove('loading');
        }

        // Чтение загружаемых файлов в оперативную память скрипта
        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if(files.length === 0) return;
            
            showProgress(10);
            let count = 0;

            for (let file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                try {
                    if (ext === 'docx') {
                        const buf = await file.arrayBuffer();
                        showProgress(40);
                        const res = await mammoth.extractRawText({ arrayBuffer: buf });
                        addFile(file.name, res.value);
                    } else if (ext === 'xlsx' || ext === 'xls') {
                        const buf = await file.arrayBuffer();
                        showProgress(40);
                        const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
                        let text = "";
                        wb.SheetNames.forEach(name => {
                            text += `Лист: ${name}\n` + XLSX.utils.sheet_to_csv(wb.Sheets[name]) + "\n";
                        });
                        addFile(file.name, text);
                    } else {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            addFile(file.name, ev.target.result);
                            showProgress(70);
                        };
                        reader.readAsText(file);
                    }
                } catch(err) {
                    alert(`Ошибка чтения файла ${file.name}`);
                }
                count++;
                showProgress(Math.floor((count / files.length) * 100));
            }
            setTimeout(hideProgress, 1000);
        });

        function addFile(name, content) {
            uploadedFilesContent.push({ name: name, content: content });
            const item = document.createElement('div');
            item.textContent = `📄 ${name} (${Math.round(content.length / 1024)} КБ текста)`;
            filesList.appendChild(item);
        }

        function smartScroll() {
            const threshold = 150;
            const isAtBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < threshold;
            if (isAtBottom) { chatMessages.scrollTop = chatMessages.scrollHeight; }
        }

        function appendMessage(sender, text, isLog = false) {
            if (isLog) {
                const logDiv = document.createElement('div');
                logDiv.classList.add('agent-log');
                logDiv.textContent = text;
                chatMessages.appendChild(logDiv);
                smartScroll();
                return logDiv;
            }

            const wrapper = document.createElement('div');
            wrapper.classList.add('message-wrapper', sender === 'user' ? 'user-wrapper' : 'ai-wrapper');

            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
            msgDiv.textContent = text;
            wrapper.appendChild(msgDiv);

            if (sender === 'ai') {
                const copyBtn = document.createElement('button');
                copyBtn.classList.add('copy-btn');
                copyBtn.textContent = 'Копировать';
                copyBtn.addEventListener('click', () => {
                    navigator.clipboard.writeText(msgDiv.textContent).then(() => {
                        copyBtn.textContent = 'Скопировано!';
                        setTimeout(() => { copyBtn.textContent = 'Копировать'; }, 2000);
                    });
                });
                wrapper.appendChild(copyBtn);
            }

            chatMessages.appendChild(wrapper);
            smartScroll();
            return msgDiv;
        }

        // Основная функция отправки запроса с умной фильтрацией контекста
        async function handleDualAgentStream() {
            const apiKey = apiKeyInput.value.trim();
            const selectedModel = modelSelect.value;
            const promptText = userInput.value.trim();
            const sysPrompt = systemPromptInput.value.trim();

            if (!apiKey) return alert('Укажите API-ключ OpenRouter!');
            if (!promptText) return alert('Введите ваш вопрос!');

            appendMessage('user', promptText);
            userInput.value = '';

            showAiThinkingProgress();
            const logElement = appendMessage('system', `🤖 Фильтрую кодекс по ключевым словам и подключаюсь к ${selectedModel}...`, true);

            // ЛОКАЛЬНЫЙ ПОИСКОВЫЙ ДВИЖОК (Вырезает из тяжелых книг только нужные статьи)
            let relevantContext = "";
            
            if (uploadedFilesContent.length > 0) {
                // Разбиваем вопрос пользователя на отдельные слова для поиска (длиной от 4 символов)
                const searchWords = promptText.toLowerCase()
                    .replace(/[^a-zа-яё0-9\s]/g, '')
                    .split(/\s+/)
                    .filter(w => w.length > 3);

                // Вытаскиваем числа (например, номер статьи "622")
                const numberMatch = promptText.match(/\d+/);
                const searchNumber = numberMatch ? numberMatch[0] : null;

                uploadedFilesContent.forEach(file => {
                    // Режем огромный текст на отдельные абзацы
                    const paragraphs = file.content.split('\n');
                    let matchedParagraphs = [];

                    paragraphs.forEach(p => {
                        const pLower = p.toLowerCase();
                        
                        // Критерий совпадения: есть искомое число (статья) ИЛИ совпало ключевое слово
                        let isMatch = false;
                        if (searchNumber && pLower.includes(searchNumber)) {
                            isMatch = true;
                        } else if (searchWords.some(word => pLower.includes(word))) {
                            isMatch = true;
                        }
                        
                        if (isMatch && p.trim().length > 10) {
                            matchedParagraphs.push(p.trim());
                        }
                    });

                    // Ограничиваем выдачу первыми 40 релевантными абзацами, чтобы не перегружать API сетью
                    if (matchedParagraphs.length > 40) {
                        matchedParagraphs = matchedParagraphs.slice(0, 40);
                    }

                    if (matchedParagraphs.length > 0) {
                        relevantContext += `--- Выдержки из файла: ${file.name} ---\n` + matchedParagraphs.join('\n\n') + '\n===\n';
                    }
                });
            }

            // Подстраховка: если по ключевым словам ничего не отфильтровалось, но файл загружен — берем первые 20 000 символов
            if (uploadedFilesContent.length > 0 && !relevantContext.trim()) {
                relevantContext = `--- Начальные главы документа ---\n` + uploadedFilesContent[0].content.substring(0, 20000) + `\n===`;
            }

            // Формируем чистую историю без сбоев
            const finalMessages = [{ role: "system", content: sysPrompt }];
            
            chatHistory.forEach(msg => {
                if (msg.role && msg.content) finalMessages.push(msg);
            });

            // Если контекст найден, отдаем его ИИ
            if (relevantContext) {
                finalMessages.push({ 
                    role: "user", 
                    content: `ВЫДЕРЖКИ ИЗ ЗАГРУЖЕННЫХ МАТЕРИАЛОВ:\n${relevantContext}\n\nЗАДАЧА: На основе предоставленных выше выдержек подробно ответь на вопрос пользователя: ${promptText}` 
                });
            } else {
                finalMessages.push({ role: "user", content: promptText });
            }

            try {
                const aiMessageElement = appendMessage('ai', 'Анализирую отфильтрованные данные и генерирую ответ...\n\n');

                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({ 
                        model: selectedModel, 
                        messages: finalMessages, 
                        stream: true 
                    })
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Код ${response.status}: ${errorText}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let aiResponseText = '';
                logElement.textContent = `✅ Данные переданы успешно. Идет прямая трансляция ответа...`;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        const cleanedLine = line.replace(/^data: /, '').trim();
                        if (cleanedLine === '' || cleanedLine === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(cleanedLine);
                            const delta = parsed.choices[0].delta.content;
                            if (delta) {
                                aiResponseText += delta;
                                aiMessageElement.textContent = aiResponseText;
                                smartScroll();
                            }
                        } catch (e) {}
                    }
                }

                // Включаем кнопку копирования после завершения генерации
                const parentWrapper = aiMessageElement.parentElement;
                const targetBtn = parentWrapper.querySelector('.copy-btn');
                if(targetBtn) targetBtn.style.display = 'block';

                // Записываем успешный диалог в историю контекста
                chatHistory.push({ role: 'user', content: promptText });
                chatHistory.push({ role: 'assistant', content: aiResponseText });
                
                // Сбрасываем список файлов на панели для следующих документов
                uploadedFilesContent = [];
                filesList.innerHTML = '';
                hideProgress();

            } catch (error) {
                logElement.textContent += `\n❌ Произошла ошибка передачи: ${error.message}`;
                logElement.style.color = '#f7768e';
                hideProgress();
            }
        }

        dualSendBtn.addEventListener('click', handleDualAgentStream);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) { e.preventDefault(); handleDualAgentStream(); }
        });
    </script>
</body>
</html>
